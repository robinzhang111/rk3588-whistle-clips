[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basketclip"
version = "0.1.0"
description = "Offline basketball event timestamp to video clip prototype"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
basketclip = "basketclip.cli:main"

[tool.setuptools.packages.find]
include = ["basketclip*"]
